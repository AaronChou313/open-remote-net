name: Test and build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./agent/internal/...
      - run: sh agent/packaging/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: orn-desktop
          path: dist/orn-agent-*
