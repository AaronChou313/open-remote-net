plugins { id 'com.android.application' }
android {
    namespace 'top.openremotehub.orn'
    compileSdk 35
    defaultConfig {
        applicationId 'top.openremotehub.orn'
        testInstrumentationRunner 'top.openremotehub.orn.CompatibilityChecks'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.1.2'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes { debug { debuggable true } }
}
dependencies { implementation files('libs/orn.aar') }
